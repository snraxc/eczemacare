<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EczemaCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center font-sans transition-colors">
    <div class="fixed top-4 right-4 flex items-center gap-2">
        <select data-lang-select onchange="setLang(this.value)" class="text-sm bg-white dark:bg-gray-800 border dark:border-gray-600 rounded px-2 py-1 text-gray-600 dark:text-gray-300 shadow"></select>
        <button onclick="toggleTheme()" title="Toggle dark mode" class="text-lg leading-none rounded-full w-9 h-9 flex items-center justify-center bg-white dark:bg-gray-800 shadow hover:bg-gray-50 dark:hover:bg-gray-700">
            <span data-theme-icon>🌙</span>
        </button>
    </div>

    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-96">
        <h2 data-i18n="register_title" class="text-2xl font-bold text-center text-blue-600 dark:text-blue-400 mb-6">Create an Account</h2>
        <div id="errorMsg" class="hidden text-red-500 dark:text-red-400 text-sm text-center mb-4"></div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label data-i18n="label_email" class="block text-gray-700 dark:text-gray-200 text-sm font-bold mb-2">Email Address</label>
                <input type="email" id="email" required autocomplete="email" class="w-full px-3 py-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring focus:border-blue-300">
            </div>
            <div>
                <label data-i18n="label_password" class="block text-gray-700 dark:text-gray-200 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring focus:border-blue-300">
            </div>
            <button type="submit" data-i18n="register_submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">Register</button>
        </form>

        <div id="successModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
            <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl max-w-sm w-full text-center transform transition-all">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 dark:bg-green-900 mb-6">
                    <svg class="h-10 w-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 data-i18n="register_almostThere" class="text-2xl font-bold text-gray-900 dark:text-gray-50 mb-2">Almost there!</h3>
                <p data-i18n="register_verificationSent" class="text-gray-500 dark:text-gray-400 mb-6">We've sent a verification code to your email. Redirecting...</p>

                <div class="flex justify-center items-center space-x-2">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-green-500"></div>
                    <span data-i18n="register_loading" class="text-sm text-green-600 dark:text-green-400 font-medium">Loading...</span>
                </div>
            </div>
        </div>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
            <span data-i18n="register_alreadyHave">Already have an account?</span> <a href="login.html" data-i18n="register_loginLink" class="text-blue-500 dark:text-blue-400 hover:underline">Log in</a>
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script src="config.js"></script>

    <script>
        document.querySelectorAll('[data-lang-select]').forEach(function (sel) {
            sel.innerHTML = buildLangSelectOptions();
            sel.value = getLang();
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const rawPassword = document.getElementById('password').value;

            // Step 1: Hash the password using SHA-256 for secure transmission
            const hashedPassword = CryptoJS.SHA256(rawPassword).toString();
            // console.log("[Auth] Password hashed successfully.");

            const formData = new FormData();
            // Note: backend's OAuth2 form field is still named "username" (fixed by the OAuth2
            // spec), but the value we send is the email address. The user picks a display
            // name later, after verifying their email (see set-username.html).
            formData.append('username', emailInput);
            formData.append('password', hashedPassword);

            // console.log(`[Auth] Attempting to register new user: ${emailInput}`);

            // Step 2: Call the Registration API
            //fetch('/eczema-api/register', {
            fetch(`${CONFIG.API_BASE_URL}/register`, {
                method: 'POST',
                body: formData
            })
            .then(res => {
                if (!res.ok) {
                    console.error("[Auth Error] Registration failed. Status:", res.status);
                    throw new Error(t('register_error_emailTaken'));
                }
                // console.log("[Auth] Registration API call successful.");
                return res.json();
            })
            .then(() => {
                // Account is created but not yet verified - show the modal, then
                // send the user to the verification page to enter their code.
                const modal = document.getElementById('successModal');
                modal.classList.remove('hidden'); // Show the modal

                setTimeout(() => {
                    window.location.href = `verify.html?email=${encodeURIComponent(emailInput)}`;
                }, 1500);
            })
            .catch(err => {
                console.error("[Auth Exception] Error caught in promise chain:", err.message);
                const errorDiv = document.getElementById('errorMsg');
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
